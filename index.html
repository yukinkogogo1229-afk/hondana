/* ------------------------------------------------------------------- */

function buildAmazonUrl(book, kindle){
  const tag = encodeURIComponent(AFFILIATE_TAG);
  if(book.asin && book.asin.trim() !== "" && !kindle){
    // 商品ページへ直リンク（紙・単行本）
    return `https://www.amazon.co.jp/dp/${book.asin}/?tag=${tag}`;
  }
  // Kindle または ASIN未設定 → 検索リンク（必ず開ける）
  const q = encodeURIComponent(book.title + " " + book.author);
  const kindleParam = kindle ? "&i=digital-text" : "";
  return `https://www.amazon.co.jp/s?k=${q}${kindleParam}&tag=${tag}`;
}

function catName(id){
  const c = CATEGORIES.find(c=>c.id===id);
  return c ? c.name : "";
}

function renderBooks(books, titleText, descText){
  const results = document.getElementById("results");
  const shelf = document.getElementById("shelf");
  document.getElementById("resultTitle").textContent = titleText;
  document.getElementById("resultDesc").textContent = descText;
  shelf.innerHTML = "";

  if(books.length === 0){
    shelf.innerHTML = `<div class="empty">ぴったりの本が見つかりませんでした。<br>下の「悩みのジャンル」から選ぶか、キーワードを変えてもう一度お試しください。</div>`;
  } else {
    books.forEach(b=>{
      const card = document.createElement("div");
      card.className = "book";
      card.innerHTML = `
        <span class="cat-tag">${catName(b.cat)}</span>
        <h3>${b.title}</h3>
        <p class="author">${b.author}</p>
        <p class="why">${b.why}</p>
        <div class="btns">
          <a class="btn btn-print" href="${buildAmazonUrl(b,false)}" target="_blank" rel="noopener nofollow sponsored">📖 本で読む</a>
          <a class="btn btn-kindle" href="${buildAmazonUrl(b,true)}" target="_blank" rel="noopener nofollow sponsored">📱 Kindleで読む</a>
        </div>`;
      shelf.appendChild(card);
    });
  }
  results.style.display = "block";
  results.scrollIntoView({behavior:"smooth", block:"start"});
}

/* 悩みテキスト＋選択チップから、スコアの高い本を返す */
function recommend(){
  const text = document.getElementById("worry").value.trim();
  const activeChips = [...document.querySelectorAll(".chip.active")].map(c=>c.dataset.cat);

  const scored = BOOKS.map(b=>{
    let score = 0;
    // キーワード一致（テキスト内に含まれる）
    b.keywords.forEach(k=>{ if(text.includes(k)) score += 2; });
    // 選択カテゴリーと一致
    if(activeChips.includes(b.cat)) score += 3;
    return {book:b, score};
  });

  let hits = scored.filter(s=>s.score>0).sort((a,b)=>b.score-a.score).map(s=>s.book);

  if(hits.length === 0 && text === "" && activeChips.length === 0){
    // 何も入力されていない → 全ジャンル代表をおすすめ
    hits = CATEGORIES.map(c => BOOKS.find(b=>b.cat===c.id)).filter(Boolean);
    renderBooks(hits, "まずはこの本棚から", "気になる本があれば、そのまま手に取ってみてください。悩みを入力すると、もっとぴったりの本が並びます。");
    return;
  }

  hits = hits.slice(0, 6);
  const desc = text ? `「${text.slice(0,40)}${text.length>40?"…":""}」の悩みに効きそうな本を選びました。`
                    : "選んだジャンルに効く本を選びました。";
  renderBooks(hits, "あなたへのおすすめ", desc);
}

/* チップ生成 */
const chipsBox = document.getElementById("chips");
CATEGORIES.forEach(c=>{
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.dataset.cat = c.id;
  chip.textContent = `${c.emoji} ${c.name}`;
  chip.onclick = ()=> chip.classList.toggle("active");
  chipsBox.appendChild(chip);
});

/* ジャンルカード生成 */
const catsGrid = document.getElementById("catsGrid");
CATEGORIES.forEach(c=>{
  const card = document.createElement("div");
  card.className = "cat-card";
  card.innerHTML = `<div class="emoji">${c.emoji}</div><div class="name">${c.name}</div>`;
  card.onclick = ()=>{
    const books = BOOKS.filter(b=>b.cat===c.id);
    renderBooks(books, `${c.emoji} ${c.name}`, "このジャンルの本棚です。");
  };
  catsGrid.appendChild(card);
});

document.getElementById("goBtn").onclick = recommend;
document.getElementById("worry").addEventListener("keydown", e=>{
  if(e.key === "Enter" && (e.ctrlKey || e.metaKey)) recommend();
});
document.getElementById("year").textContent = new Date().getFullYear();
</script>
